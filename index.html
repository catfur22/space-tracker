
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111820;
            color: #e5eaf0;
            font-family: Arial, sans-serif;
        }

        header {
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: #19222c;
            border-bottom: 1px solid #34404d;
        }

        .brand {
            font-size: 19px;
            font-weight: 600;
        }

        .status {
            color: #aab5c1;
            font-size: 12px;
        }

        main {
            display: grid;
            grid-template-columns: 255px minmax(0, 1fr) 270px;
            height: calc(100vh - 58px);
        }

        aside {
            min-height: 0;
            overflow-y: auto;
            padding: 16px;
            background: #19222c;
        }

        .left-panel {
            border-right: 1px solid #34404d;
        }

        .right-panel {
            border-left: 1px solid #34404d;
        }

        h2 {
            margin: 0 0 14px;
            font-size: 15px;
        }

        h3 {
            margin: 20px 0 10px;
            color: #9eabb9;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #3b4855;
            border-radius: 4px;
            background: #111820;
            color: white;
            font-size: 13px;
        }

        button {
            padding: 9px 12px;
            border: 1px solid #465767;
            border-radius: 4px;
            background: #263747;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #354c60;
        }

        .filter-list {
            display: grid;
            gap: 10px;
            color: #c4ced8;
            font-size: 13px;
        }

        .filter-list label {
            display: flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
        }

        .filter-list input {
            width: auto;
            margin: 0;
        }

        .count {
            margin: 12px 0;
            color: #94a2b0;
            font-size: 12px;
        }

        .object-list {
            display: grid;
            gap: 5px;
        }

        .object-item {
            padding: 10px;
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .object-item:hover {
            background: #25313d;
        }

        .object-item.selected {
            background: #293e50;
            border-color: #58758d;
        }

        .object-item small {
            display: block;
            margin-top: 5px;
            color: #91a0ae;
        }

        .map-area {
            position: relative;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: #101c29;
        }

        #worldMap {
            display: block;
            width: 100%;
            height: 100%;
            background: #101c29;
        }

        .ocean {
            fill: #101c29;
        }

        .land {
            fill: #263b48;
            stroke: #486071;
            stroke-width: 1.3;
            stroke-linejoin: round;
        }

        .grid-line {
            fill: none;
            stroke: #304352;
            stroke-width: 0.8;
            opacity: 0.65;
        }

        .equator {
            stroke: #607587;
            opacity: 0.6;
        }

        .satellite {
            cursor: pointer;
            stroke: #ffffff;
            stroke-width: 1.2;
        }

        .satellite.selected {
            stroke: white;
            stroke-width: 3;
        }

        .satellite:hover {
            stroke-width: 3;
        }

        .trail {
            fill: none;
            stroke: #f2b84b;
            stroke-width: 2;
            stroke-dasharray: 5 4;
        }

        .map-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            display: grid;
            gap: 5px;
        }

        .map-controls button {
            width: 36px;
            height: 36px;
            padding: 0;
            background: #192631;
            font-size: 18px;
        }

        .map-status {
            position: absolute;
            bottom: 12px;
            left: 12px;
            padding: 8px 11px;
            border-radius: 4px;
            background: #192631;
            color: #dce5ed;
            font-size: 12px;
        }

        .detail-empty,
        .loading {
            color: #91a0ae;
            font-size: 13px;
            line-height: 1.5;
        }

        .detail-name {
            margin-bottom: 5px;
            font-size: 17px;
            font-weight: 600;
        }

        .detail-id {
            margin-bottom: 18px;
            color: #91a0ae;
            font-size: 12px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 11px 0;
            border-bottom: 1px solid #34404d;
            font-size: 13px;
        }

        .detail-row span:first-child {
            color: #91a0ae;
        }

        .detail-row span:last-child {
            text-align: right;
        }

        .detail-actions {
            display: grid;
            gap: 8px;
            margin-top: 18px;
        }

        .detail-actions button {
            width: 100%;
        }

        @media (max-width: 950px) {
            main {
                grid-template-columns: 220px minmax(0, 1fr);
            }

            .right-panel {
                display: none;
            }
        }

        @media (max-width: 650px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: 230px minmax(0, 1fr);
            }

            .left-panel {
                border-right: none;
                border-bottom: 1px solid #34404d;
            }

            .map-area {
                grid-row: 2;
            }

            .object-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="brand">Space Tracker</div>
        <div class="status" id="connectionStatus">Starting...</div>
    </header>

    <main>
        <aside class="left-panel">
            <h2>Objects</h2>

            <input
                id="search"
                type="text"
                placeholder="Search name or NORAD ID..."
            >

            <h3>Categories</h3>

            <div class="filter-list">
                <label>
                    <input type="checkbox" value="all" checked>
                    All objects
                </label>

                <label>
                    <input type="checkbox" value="stations">
                    Space stations
                </label>

                <label>
                    <input type="checkbox" value="starlink">
                    Starlink
                </label>

                <label>
                    <input type="checkbox" value="gps">
                    GPS
                </label>

                <label>
                    <input type="checkbox" value="weather">
                    Weather
                </label>

                <label>
                    <input type="checkbox" value="other">
                    Other
                </label>
            </div>

            <h3>Tracked objects</h3>

            <div class="count" id="objectCount">
                Waiting for data...
            </div>

            <div class="object-list" id="objectList">
                <div class="loading">Loading objects...</div>
            </div>
        </aside>

        <section class="map-area">
            <svg
                id="worldMap"
                viewBox="0 0 1200 600"
                preserveAspectRatio="xMidYMid meet"
                xmlns="http://www.w3.org/2000/svg"
            >
                <rect class="ocean" width="1200" height="600"/>

                <g id="grid"></g>

                <g id="continents">
                    <path class="land" d="
                        M 80,105
                        L 115,75 165,65 195,82 230,75
                        255,95 290,100 315,125 300,155
                        275,166 260,190 240,205 225,230
                        205,250 190,275 170,270 160,245
                        145,225 130,195 110,180 100,150
                        75,135 Z
                    "/>

                    <path class="land" d="
                        M 270,275
                        L 300,285 320,315 325,350
                        310,390 300,425 285,460
                        270,490 250,475 245,445
                        235,420 240,390 225,360
                        230,330 245,300 Z
                    "/>

                    <path class="land" d="
                        M 490,110
                        L 530,90 575,95 610,110
                        650,105 680,120 720,110
                        750,125 785,120 820,135
                        860,125 900,140 935,155
                        965,180 950,205 920,210
                        890,195 865,205 840,225
                        810,220 785,245 760,255
                        740,280 715,285 700,260
                        680,240 660,220 630,210
                        610,185 580,170 550,155
                        520,145 495,130 Z
                    "/>

                    <path class="land" d="
                        M 530,220
                        L 560,225 585,245 600,275
                        610,310 595,345 580,380
                        555,420 530,440 510,415
                        500,380 490,350 495,315
                        505,280 515,245 Z
                    "/>

                    <path class="land" d="
                        M 880,285
                        L 920,275 960,285 995,300
                        1030,315 1060,340 1080,370
                        1060,390 1030,380 1000,395
                        970,380 940,365 915,345
                        890,330 875,305 Z
                    "/>

                    <path class="land" d="
                        M 1010,115
                        L 1040,100 1070,110 1095,130
                        1120,155 1105,180 1080,185
                        1050,170 1025,150 Z
                    "/>

                    <path class="land" d="
                        M 1060,420
                        L 1090,410 1115,430 1105,455
                        1080,465 1055,450 Z
                    "/>

                    <path class="land" d="
                        M 380,70
                        L 405,55 425,65 415,85 390,90 Z
                    "/>

                    <path class="land" d="
                        M 445,500
                        L 470,495 490,505 475,520 450,515 Z
                    "/>

                    <path class="land" d="
                        M 0,560
                        L 1200,560 1200,600 0,600 Z
                    " opacity="0.25"/>
                </g>

                <g id="trailGroup"></g>
                <g id="markerGroup"></g>
            </svg>

            <div class="map-controls">
                <button id="zoomIn" title="Zoom in">+</button>
                <button id="zoomOut" title="Zoom out">−</button>
                <button id="resetZoom" title="Reset view">⌂</button>
            </div>

            <div class="map-status" id="mapStatus">
                World map ready
            </div>
        </section>

        <aside class="right-panel">
            <h2>Object information</h2>

            <div id="details">
                <div class="detail-empty">
                    Select a satellite to see its information.
                </div>
            </div>
        </aside>
    </main>

    <script>
        const API_URL =
            "https://satellites.orbitingfrog.com/api/positions?group=visual";

        const REFRESH_INTERVAL = 15000;

        const svgNS = "http://www.w3.org/2000/svg";

        const grid = document.getElementById("grid");
        const markerGroup = document.getElementById("markerGroup");
        const trailGroup = document.getElementById("trailGroup");

        let objects = [];
        let selectedId = null;
        let markers = new Map();
        let following = false;
        let zoom = 1;
        let centerX = 600;
        let centerY = 300;

        function setStatus(message) {
            document.getElementById("mapStatus").textContent = message;
        }

        function project(lat, lon) {
            return {
                x: (lon + 180) * (1200 / 360),
                y: (90 - lat) * (600 / 180)
            };
        }

        function drawGrid() {
            grid.innerHTML = "";

            for (let lon = -180; lon <= 180; lon += 30) {
                const point = project(0, lon);

                const line = document.createElementNS(svgNS, "line");
                line.setAttribute("x1", point.x);
                line.setAttribute("x2", point.x);
                line.setAttribute("y1", 0);
                line.setAttribute("y2", 600);
                line.setAttribute("class", "grid-line");

                grid.appendChild(line);
            }

            for (let lat = -60; lat <= 60; lat += 30) {
                const point = project(lat, 0);

                const line = document.createElementNS(svgNS, "line");
                line.setAttribute("x1", 0);
                line.setAttribute("x2", 1200);
                line.setAttribute("y1", point.y);
                line.setAttribute("y2", point.y);
                line.setAttribute("class", "grid-line");

                if (lat === 0) {
                    line.classList.add("equator");
                }

                grid.appendChild(line);
            }
        }

        function updateView() {
            const width = 1200 / zoom;
            const height = 600 / zoom;

            const x = centerX - width / 2;
            const y = centerY - height / 2;

            document.getElementById("worldMap").setAttribute(
                "viewBox",
                `${x} ${y} ${width} ${height}`
            );
        }

        document.getElementById("zoomIn").addEventListener("click", function () {
            zoom = Math.min(zoom * 1.5, 6);
            updateView();
        });

        document.getElementById("zoomOut").addEventListener("click", function () {
            zoom = Math.max(zoom / 1.5, 1);
            updateView();
        });

        document.getElementById("resetZoom").addEventListener("click", function () {
            zoom = 1;
            centerX = 600;
            centerY = 300;
            updateView();
        });

        function getCategory(name) {
            const value = name.toLowerCase();

            if (
                value.includes("iss") ||
                value.includes("tiangong") ||
                value.includes("space station")
            ) {
                return "stations";
            }

            if (value.includes("starlink")) {
                return "starlink";
            }

            if (
                value.includes("gps") ||
                value.includes("navstar")
            ) {
                return "gps";
            }

            if (
                value.includes("weather") ||
                value.includes("noaa") ||
                value.includes("goes") ||
                value.includes("meteor")
            ) {
                return "weather";
            }

            return "other";
        }

        function normalizeObject(item) {
            return {
                id: String(item.noradId ?? item.id ?? ""),
                name: String(item.name || "Unknown object"),
                lat: Number(item.lat),
                lon: Number(item.lon),
                altitude: Number(item.alt),
                velocity: Number(item.velocity),
                color: item.color || "#54a9df",
                orbit: Array.isArray(item.orbit) ? item.orbit : [],
                category: getCategory(String(item.name || ""))
            };
        }

        function formatNumber(value, digits = 2) {
            if (!Number.isFinite(value)) {
                return "Unavailable";
            }

            return value.toLocaleString(undefined, {
                maximumFractionDigits: digits
            });
        }

        function getVisibleObjects() {
            const search = document
                .getElementById("search")
                .value
                .trim()
                .toLowerCase();

            const checked = Array.from(
                document.querySelectorAll(".filter-list input:checked")
            ).map(input => input.value);

            const showAll =
                checked.includes("all") || checked.length === 0;

            return objects.filter(object => {
                const matchesSearch =
                    object.name.toLowerCase().includes(search) ||
                    object.id.toLowerCase().includes(search);

                const matchesCategory =
                    showAll || checked.includes(object.category);

                return matchesSearch && matchesCategory;
            });
        }

        function drawMarkers() {
            markerGroup.innerHTML = "";
            markers.clear();

            const visibleObjects = getVisibleObjects();

            visibleObjects.forEach(object => {
                if (
                    !Number.isFinite(object.lat) ||
                    !Number.isFinite(object.lon)
                ) {
                    return;
                }

                const position = project(object.lat, object.lon);

                const circle = document.createElementNS(svgNS, "circle");

                circle.setAttribute("cx", position.x);
                circle.setAttribute("cy", position.y);
                circle.setAttribute("r", selectedId === object.id ? 6 : 4);
                circle.setAttribute("fill", object.color);
                circle.setAttribute(
                    "class",
                    selectedId === object.id
                        ? "satellite selected"
                        : "satellite"
                );

                const title = document.createElementNS(svgNS, "title");
                title.textContent = object.name;
                circle.appendChild(title);

                circle.addEventListener("click", function () {
                    selectObject(object.id);
                });

                markerGroup.appendChild(circle);
                markers.set(object.id, circle);
            });
        }

        function updateList() {
            const list = document.getElementById("objectList");
            const count = document.getElementById("objectCount");

            const visibleObjects = getVisibleObjects();

            count.textContent =
                visibleObjects.length.toLocaleString() + " objects shown";

            list.innerHTML = "";

            if (visibleObjects.length === 0) {
                list.innerHTML =
                    '<div class="loading">No matching objects.</div>';
                return;
            }

            const fragment = document.createDocumentFragment();

            visibleObjects.slice(0, 300).forEach(object => {
                const item = document.createElement("div");

                item.className = "object-item";

                if (selectedId === object.id) {
                    item.classList.add("selected");
                }

                const name = document.createElement("div");
                name.textContent = object.name;

                const id = document.createElement("small");
                id.textContent = "NORAD " + object.id;

                item.appendChild(name);
                item.appendChild(id);

                item.addEventListener("click", function () {
                    selectObject(object.id);
                });

                fragment.appendChild(item);
            });

            list.appendChild(fragment);
        }

        function addDetailRow(container, label, value) {
            const row = document.createElement("div");
            row.className = "detail-row";

            const left = document.createElement("span");
            left.textContent = label;

            const right = document.createElement("span");
            right.textContent = value;

            row.appendChild(left);
            row.appendChild(right);
            container.appendChild(row);
        }

        function showDetails(object) {
            const details = document.getElementById("details");

            details.innerHTML = "";

            const name = document.createElement("div");
            name.className = "detail-name";
            name.textContent = object.name;

            const id = document.createElement("div");
            id.className = "detail-id";
            id.textContent = "NORAD ID: " + object.id;

            details.appendChild(name);
            details.appendChild(id);

            addDetailRow(details, "Category", object.category);
            addDetailRow(details, "Latitude", formatNumber(object.lat, 5) + "°");
            addDetailRow(details, "Longitude", formatNumber(object.lon, 5) + "°");
            addDetailRow(details, "Altitude", formatNumber(object.altitude) + " km");
            addDetailRow(details, "Velocity", formatNumber(object.velocity, 3) + " km/s");

            const actions = document.createElement("div");
            actions.className = "detail-actions";

            const followButton = document.createElement("button");
            followButton.textContent = following
                ? "Stop following"
                : "Follow object";

            followButton.addEventListener("click", function () {
                following = !following;

                if (following) {
                    centerX = project(object.lat, object.lon).x;
                    centerY = project(object.lat, object.lon).y;
                    zoom = Math.max(zoom, 2);
                    updateView();
                }

                showDetails(object);
            });

            const trailButton = document.createElement("button");
            trailButton.textContent = "Show orbital trail";

            trailButton.addEventListener("click", function () {
                drawTrail(object);
            });

            const clearButton = document.createElement("button");
            clearButton.textContent = "Clear trail";

            clearButton.addEventListener("click", function () {
                trailGroup.innerHTML = "";
                setStatus("World map ready");
            });

            actions.appendChild(followButton);
            actions.appendChild(trailButton);
            actions.appendChild(clearButton);

            details.appendChild(actions);
        }

        function selectObject(id) {
            const object = objects.find(item => item.id === id);

            if (!object) {
                return;
            }

            selectedId = object.id;
            following = false;

            const position = project(object.lat, object.lon);

            centerX = position.x;
            centerY = position.y;
            zoom = Math.max(zoom, 2);

            updateView();
            drawMarkers();
            updateList();
            showDetails(object);
        }

        function drawTrail(object) {
            trailGroup.innerHTML = "";

            const points = object.orbit
                .filter(point =>
                    Array.isArray(point) &&
                    Number.isFinite(Number(point[0])) &&
                    Number.isFinite(Number(point[1]))
                )
                .map(point => project(Number(point[0]), Number(point[1])));

            if (points.length < 2) {
                setStatus("No orbital trail data available");
                return;
            }

            const polyline = document.createElementNS(svgNS, "polyline");

            polyline.setAttribute(
                "points",
                points.map(point => `${point.x},${point.y}`).join(" ")
            );

            polyline.setAttribute("class", "trail");

            trailGroup.appendChild(polyline);

            setStatus("Showing orbital trail");
        }

        async function loadObjects() {
            const status = document.getElementById("connectionStatus");

            try {
                const response = await fetch(API_URL, {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }

                const data = await response.json();

                if (!Array.isArray(data)) {
                    throw new Error("Unexpected data format");
                }

                objects = data
                    .map(normalizeObject)
                    .filter(object =>
                        object.id &&
                        Number.isFinite(object.lat) &&
                        Number.isFinite(object.lon)
                    );

                status.innerHTML =
                    '<span style="color:#68cf91">●</span> Connected · ' +
                    objects.length.toLocaleString() +
                    " objects";

                drawMarkers();
                updateList();

                setStatus("World map ready · Satellite data loaded");

            } catch (error) {
                console.error("Satellite data error:", error);

                status.innerHTML =
                    '<span style="color:#e58b80">●</span> Data unavailable';

                document.getElementById("objectCount").textContent =
                    "Satellite feed unavailable";

                document.getElementById("objectList").innerHTML =
                    '<div class="loading">Could not load satellite data. The world map is still available.</div>';

                setStatus("World map ready · Waiting for satellite data");
            }
        }

        document.getElementById("search").addEventListener(
            "input",
            function () {
                drawMarkers();
                updateList();
            }
        );

        document.querySelectorAll(".filter-list input").forEach(input => {
            input.addEventListener("change", function () {
                const allInput = document.querySelector(
                    '.filter-list input[value="all"]'
                );

                const categoryInputs = document.querySelectorAll(
                    '.filter-list input:not([value="all"])'
                );

                if (input.value === "all" && input.checked) {
                    categoryInputs.forEach(item => {
                        item.checked = false;
                    });
                } else if (input.value !== "all") {
                    allInput.checked = false;

                    const allChecked = Array.from(categoryInputs).every(
                        item => item.checked
                    );

                    if (allChecked) {
                        allInput.checked = true;
                    }
                }

                drawMarkers();
                updateList();
            });
        });

        drawGrid();
        updateView();
        loadObjects();

        setInterval(loadObjects, REFRESH_INTERVAL);

        setInterval(function () {
            if (!following || !selectedId) {
                return;
            }

            const object = objects.find(
                item => item.id === selectedId
            );

            if (object) {
                const position = project(object.lat, object.lon);

                centerX = position.x;
                centerY = position.y;

                updateView();
            }
        }, 2000);
    </script>
</body>
</html>
