
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Tracker</title>

    <link
        href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #10151b;
            color: #e5eaf0;
            font-family: Arial, sans-serif;
        }

        header {
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            background: #171e26;
            border-bottom: 1px solid #303943;
        }

        .brand {
            font-size: 19px;
            font-weight: 600;
        }

        .status {
            color: #aab5c1;
            font-size: 12px;
        }

        .status-dot {
            color: #68cf91;
        }

        main {
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr) 280px;
            height: calc(100vh - 58px);
        }

        aside {
            min-height: 0;
            overflow-y: auto;
            padding: 16px;
            background: #171e26;
        }

        .left-panel {
            border-right: 1px solid #303943;
        }

        .right-panel {
            border-left: 1px solid #303943;
        }

        h2 {
            margin: 0 0 14px;
            font-size: 15px;
        }

        h3 {
            margin: 20px 0 10px;
            color: #aab5c1;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        input,
        button {
            width: 100%;
            padding: 10px;
            border: 1px solid #394550;
            border-radius: 4px;
            background: #111820;
            color: #e5eaf0;
            font-size: 13px;
        }

        input {
            margin-bottom: 9px;
        }

        button {
            cursor: pointer;
            background: #263747;
            border-color: #405568;
        }

        button:hover {
            background: #334a60;
        }

        .filter-list {
            display: grid;
            gap: 10px;
            color: #c5ced8;
            font-size: 13px;
        }

        .filter-list label {
            display: flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
        }

        .filter-list input {
            width: auto;
            margin: 0;
        }

        .object-list {
            display: grid;
            gap: 5px;
            margin-top: 12px;
        }

        .object-item {
            padding: 10px;
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .object-item:hover {
            background: #222d38;
        }

        .object-item.selected {
            background: #263747;
            border-color: #506b82;
        }

        .object-item small {
            display: block;
            margin-top: 5px;
            color: #8f9daa;
        }

        .map-area {
            position: relative;
            min-width: 0;
            min-height: 0;
            background: #171e26;
        }

        #map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #171e26;
        }

        .map-status {
            position: absolute;
            z-index: 5;
            bottom: 12px;
            left: 12px;
            padding: 8px 11px;
            border-radius: 4px;
            background: rgba(20, 27, 35, 0.92);
            color: #dce5ed;
            font-size: 12px;
            pointer-events: none;
        }

        .detail-empty,
        .loading {
            color: #91a0ae;
            font-size: 13px;
            line-height: 1.5;
        }

        .detail-name {
            margin-bottom: 5px;
            font-size: 17px;
            font-weight: 600;
        }

        .detail-id {
            margin-bottom: 20px;
            color: #91a0ae;
            font-size: 12px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 11px 0;
            border-bottom: 1px solid #303943;
            font-size: 13px;
        }

        .detail-row span:first-child {
            color: #91a0ae;
        }

        .detail-row span:last-child {
            text-align: right;
        }

        .detail-actions {
            display: grid;
            gap: 8px;
            margin-top: 18px;
        }

        .secondary {
            background: #171e26;
        }

        .count {
            margin-top: 12px;
            color: #91a0ae;
            font-size: 12px;
        }

        .satellite-marker {
            width: 11px;
            height: 11px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.7);
            cursor: pointer;
        }

        .satellite-marker.selected {
            width: 16px;
            height: 16px;
            border: 2px solid white;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.2);
        }

        .maplibregl-ctrl-group {
            background: #171e26 !important;
        }

        .maplibregl-ctrl-group button {
            background-color: #171e26 !important;
        }

        .maplibregl-ctrl-group button span {
            filter: invert(1);
        }

        .maplibregl-ctrl-attrib {
            color: #222 !important;
        }

        @media (max-width: 950px) {
            main {
                grid-template-columns: 220px minmax(0, 1fr);
            }

            .right-panel {
                display: none;
            }
        }

        @media (max-width: 650px) {
            header {
                padding: 0 12px;
            }

            main {
                grid-template-columns: 1fr;
                grid-template-rows: 230px minmax(0, 1fr);
                height: calc(100vh - 58px);
            }

            .left-panel {
                border-right: none;
                border-bottom: 1px solid #303943;
            }

            .map-area {
                grid-row: 2;
            }

            aside {
                padding: 12px;
            }

            .object-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="brand">Space Tracker</div>
        <div class="status" id="connectionStatus">
            Connecting...
        </div>
    </header>

    <main>
        <aside class="left-panel">
            <h2>Objects</h2>

            <input
                id="search"
                type="text"
                placeholder="Search name or NORAD ID..."
            >

            <h3>Categories</h3>

            <div class="filter-list">
                <label>
                    <input type="checkbox" value="all" checked>
                    All objects
                </label>

                <label>
                    <input type="checkbox" value="stations">
                    Space stations
                </label>

                <label>
                    <input type="checkbox" value="starlink">
                    Starlink
                </label>

                <label>
                    <input type="checkbox" value="gps">
                    GPS
                </label>

                <label>
                    <input type="checkbox" value="weather">
                    Weather
                </label>

                <label>
                    <input type="checkbox" value="other">
                    Other
                </label>
            </div>

            <h3>Tracked objects</h3>

            <div class="count" id="objectCount">
                Loading objects...
            </div>

            <div class="object-list" id="objectList">
                <div class="loading">Loading satellite data...</div>
            </div>
        </aside>

        <section class="map-area">
            <div id="map"></div>
            <div class="map-status" id="mapStatus">
                Starting map...
            </div>
        </section>

        <aside class="right-panel">
            <h2>Object information</h2>

            <div id="details">
                <div class="detail-empty">
                    Select an object on the map or from the list to see its information.
                </div>
            </div>
        </aside>
    </main>

    <script type="module">
        import * as maplibregl from
            "https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.mjs";

        const API_URL =
            "https://satellites.orbitingfrog.com/api/positions?group=visual";

        const REFRESH_INTERVAL = 15000;

        const MAP_STYLES = [
            "https://tiles.openfreemap.org/styles/dark",
            "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json"
        ];

        const mapStatus = document.getElementById("mapStatus");
        const connectionStatus =
            document.getElementById("connectionStatus");

        let map;
        let currentStyle = 0;
        let styleLoaded = false;
        let fallbackStarted = false;

        let objects = [];
        let markers = new Map();
        let selectedId = null;
        let selectedMarker = null;
        let following = false;
        let trailData = null;

        function setMapStatus(message) {
            mapStatus.textContent = message;
        }

        function startMap(styleIndex) {
            currentStyle = styleIndex;
            styleLoaded = false;

            setMapStatus(
                styleIndex === 0
                    ? "Loading OpenFreeMap..."
                    : "Trying alternate map..."
            );

            if (map) {
                map.remove();
            }

            markers.clear();
            selectedMarker = null;

            map = new maplibregl.Map({
                container: "map",
                style: MAP_STYLES[styleIndex],
                center: [0, 20],
                zoom: 2,
                minZoom: 1,
                maxZoom: 18,
                renderWorldCopies: true,
                attributionControl: true
            });

            map.addControl(
                new maplibregl.NavigationControl(),
                "top-right"
            );

            map.on("load", function () {
                styleLoaded = true;

                setMapStatus(
                    styleIndex === 0
                        ? "Map loaded"
                        : "Map loaded · Alternate provider"
                );

                addTrailLayer();
                updateMarkers();
            });

            map.on("error", function (event) {
                console.error("Map error:", event.error || event);

                if (!styleLoaded && styleIndex === 0) {
                    setMapStatus("Map service error. Trying another...");
                }
            });

            map.on("style.load", function () {
                addTrailLayer();
            });
        }

        function switchToFallback() {
            if (fallbackStarted) {
                return;
            }

            fallbackStarted = true;

            if (currentStyle === 0) {
                startMap(1);
            } else {
                setMapStatus("Map providers could not load.");
            }
        }

        startMap(0);

        setTimeout(function () {
            if (!styleLoaded) {
                switchToFallback();
            }
        }, 10000);

        function getCategory(name) {
            const value = name.toLowerCase();

            if (
                value.includes("iss") ||
                value.includes("tiangong") ||
                value.includes("space station")
            ) {
                return "stations";
            }

            if (value.includes("starlink")) {
                return "starlink";
            }

            if (
                value.includes("gps") ||
                value.includes("navstar")
            ) {
                return "gps";
            }

            if (
                value.includes("weather") ||
                value.includes("noaa") ||
                value.includes("goes") ||
                value.includes("meteor")
            ) {
                return "weather";
            }

            return "other";
        }

        function normalizeObject(item) {
            return {
                id: String(item.noradId ?? item.id ?? ""),
                name: String(item.name || "Unknown object"),
                lat: Number(item.lat),
                lon: Number(item.lon),
                altitude: Number(item.alt),
                velocity: Number(item.velocity),
                color: item.color || "#4d9bd3",
                orbit: Array.isArray(item.orbit) ? item.orbit : [],
                category: getCategory(String(item.name || ""))
            };
        }

        function formatNumber(value, digits = 2) {
            if (!Number.isFinite(value)) {
                return "Unavailable";
            }

            return value.toLocaleString(undefined, {
                maximumFractionDigits: digits
            });
        }

        function getVisibleObjects() {
            const search = document
                .getElementById("search")
                .value
                .trim()
                .toLowerCase();

            const checked = Array.from(
                document.querySelectorAll(".filter-list input:checked")
            ).map(input => input.value);

            const showAll =
                checked.includes("all") || checked.length === 0;

            return objects.filter(object => {
                const matchesSearch =
                    object.name.toLowerCase().includes(search) ||
                    object.id.toLowerCase().includes(search);

                const matchesCategory =
                    showAll || checked.includes(object.category);

                return matchesSearch && matchesCategory;
            });
        }

        function createMarker(object) {
            const element = document.createElement("div");

            element.className = "satellite-marker";
            element.style.backgroundColor = object.color;
            element.title = object.name;

            const marker = new maplibregl.Marker({
                element: element,
                anchor: "center"
            })
                .setLngLat([object.lon, object.lat])
                .addTo(map);

            element.addEventListener("click", function () {
                selectObject(object.id);
            });

            return marker;
        }

        function updateMarkers() {
            if (!map || !styleLoaded) {
                return;
            }

            const visibleObjects = getVisibleObjects();

            const visibleIds = new Set(
                visibleObjects.map(object => object.id)
            );

            for (const [id, marker] of markers) {
                if (!visibleIds.has(id)) {
                    marker.remove();
                    markers.delete(id);
                }
            }

            for (const object of visibleObjects) {
                if (
                    !Number.isFinite(object.lat) ||
                    !Number.isFinite(object.lon)
                ) {
                    continue;
                }

                let marker = markers.get(object.id);

                if (!marker) {
                    marker = createMarker(object);
                    markers.set(object.id, marker);
                } else {
                    marker.setLngLat([object.lon, object.lat]);

                    const element = marker.getElement();
                    element.style.backgroundColor = object.color;
                    element.title = object.name;
                }

                if (object.id === selectedId) {
                    marker.getElement().classList.add("selected");
                    selectedMarker = marker;
                } else {
                    marker.getElement().classList.remove("selected");
                }
            }

            if (selectedId) {
                const updated = objects.find(
                    object => object.id === selectedId
                );

                if (updated) {
                    showDetails(updated);
                }
            }

            updateList();
        }

        function updateList() {
            const list = document.getElementById("objectList");
            const count = document.getElementById("objectCount");

            const visibleObjects = getVisibleObjects();

            count.textContent =
                visibleObjects.length.toLocaleString() + " objects shown";

            list.innerHTML = "";

            if (visibleObjects.length === 0) {
                list.innerHTML =
                    '<div class="loading">No matching objects.</div>';
                return;
            }

            const fragment = document.createDocumentFragment();

            visibleObjects.slice(0, 300).forEach(object => {
                const item = document.createElement("div");

                item.className = "object-item";

                if (selectedId === object.id) {
                    item.classList.add("selected");
                }

                const name = document.createElement("div");
                name.textContent = object.name;

                const id = document.createElement("small");
                id.textContent = "NORAD " + object.id;

                item.appendChild(name);
                item.appendChild(id);

                item.addEventListener("click", function () {
                    selectObject(object.id);
                });

                fragment.appendChild(item);
            });

            list.appendChild(fragment);
        }

        function addDetailRow(container, label, value) {
            const row = document.createElement("div");
            row.className = "detail-row";

            const left = document.createElement("span");
            left.textContent = label;

            const right = document.createElement("span");
            right.textContent = value;

            row.appendChild(left);
            row.appendChild(right);

            container.appendChild(row);
        }

        function showDetails(object) {
            const details = document.getElementById("details");

            details.innerHTML = "";

            const name = document.createElement("div");
            name.className = "detail-name";
            name.textContent = object.name;

            const id = document.createElement("div");
            id.className = "detail-id";
            id.textContent = "NORAD ID: " + object.id;

            details.appendChild(name);
            details.appendChild(id);

            addDetailRow(details, "Category", object.category);

            addDetailRow(
                details,
                "Latitude",
                formatNumber(object.lat, 5) + "°"
            );

            addDetailRow(
                details,
                "Longitude",
                formatNumber(object.lon, 5) + "°"
            );

            addDetailRow(
                details,
                "Altitude",
                formatNumber(object.altitude) + " km"
            );

            addDetailRow(
                details,
                "Velocity",
                formatNumber(object.velocity, 3) + " km/s"
            );

            const actions = document.createElement("div");
            actions.className = "detail-actions";

            const followButton = document.createElement("button");

            followButton.textContent = following
                ? "Stop following"
                : "Follow object";

            followButton.addEventListener("click", function () {
                following = !following;

                if (following) {
                    map.flyTo({
                        center: [object.lon, object.lat],
                        zoom: Math.max(map.getZoom(), 4),
                        duration: 800
                    });
                }

                showDetails(object);
            });

            const trailButton = document.createElement("button");
            trailButton.className = "secondary";
            trailButton.textContent = "Show orbital trail";

            trailButton.addEventListener("click", function () {
                showTrail(object);
            });

            const clearButton = document.createElement("button");
            clearButton.className = "secondary";
            clearButton.textContent = "Clear trail";

            clearButton.addEventListener("click", clearTrail);

            actions.appendChild(followButton);
            actions.appendChild(trailButton);
            actions.appendChild(clearButton);

            details.appendChild(actions);
        }

        function selectObject(id) {
            const object = objects.find(item => item.id === id);

            if (!object) {
                return;
            }

            selectedId = object.id;
            following = false;

            updateMarkers();
            updateList();
            showDetails(object);

            if (map && styleLoaded) {
                map.flyTo({
                    center: [object.lon, object.lat],
                    zoom: Math.max(map.getZoom(), 4),
                    duration: 800
                });
            }
        }

        function addTrailLayer() {
            if (!map || !map.isStyleLoaded()) {
                return;
            }

            if (!map.getSource("orbit-trail")) {
                map.addSource("orbit-trail", {
                    type: "geojson",
                    data: {
                        type: "FeatureCollection",
                        features: []
                    }
                });

                map.addLayer({
                    id: "orbit-trail-line",
                    type: "line",
                    source: "orbit-trail",
                    paint: {
                        "line-color": "#f2b84b",
                        "line-width": 2,
                        "line-opacity": 0.85
                    }
                });
            }

            if (trailData) {
                map.getSource("orbit-trail").setData(trailData);
            }
        }

        function showTrail(object) {
            const points = object.orbit
                .filter(point =>
                    Array.isArray(point) &&
                    Number.isFinite(Number(point[0])) &&
                    Number.isFinite(Number(point[1]))
                )
                .map(point => [
                    Number(point[1]),
                    Number(point[0])
                ]);

            if (points.length < 2) {
                setMapStatus("No orbital trail data available");
                return;
            }

            trailData = {
                type: "FeatureCollection",
                features: [{
                    type: "Feature",
                    properties: {},
                    geometry: {
                        type: "LineString",
                        coordinates: points
                    }
                }]
            };

            addTrailLayer();

            const longitudes = points.map(point => point[0]);
            const latitudes = points.map(point => point[1]);

            const bounds = [
                [
                    Math.min(...longitudes),
                    Math.min(...latitudes)
                ],
                [
                    Math.max(...longitudes),
                    Math.max(...latitudes)
                ]
            ];

            map.fitBounds(bounds, {
                padding: 50,
                maxZoom: 5
            });

            setMapStatus("Showing orbital trail");
        }

        function clearTrail() {
            trailData = null;

            if (map && map.getSource("orbit-trail")) {
                map.getSource("orbit-trail").setData({
                    type: "FeatureCollection",
                    features: []
                });
            }

            setMapStatus(
                currentStyle === 0
                    ? "Map loaded"
                    : "Map loaded · Alternate provider"
            );
        }

        async function loadObjects() {
            try {
                const response = await fetch(API_URL, {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error(
                        "Server returned " + response.status
                    );
                }

                const data = await response.json();

                if (!Array.isArray(data)) {
                    throw new Error("Unexpected satellite data format");
                }

                objects = data
                    .map(normalizeObject)
                    .filter(object =>
                        object.id &&
                        Number.isFinite(object.lat) &&
                        Number.isFinite(object.lon)
                    );

                connectionStatus.innerHTML =
                    '<span class="status-dot">●</span> Connected · ' +
                    objects.length.toLocaleString() +
                    " objects";

                updateMarkers();
                updateList();

            } catch (error) {
                console.error("Satellite data error:", error);

                connectionStatus.textContent =
                    "Satellite data unavailable";

                document.getElementById("objectList").innerHTML =
                    '<div class="loading">Could not load satellite data. Check the browser console for details.</div>';
            }
        }

        document.getElementById("search").addEventListener(
            "input",
            function () {
                updateMarkers();
                updateList();
            }
        );

        document.querySelectorAll(".filter-list input").forEach(input => {
            input.addEventListener("change", function () {
                const allInput = document.querySelector(
                    '.filter-list input[value="all"]'
                );

                const categoryInputs = document.querySelectorAll(
                    '.filter-list input:not([value="all"])'
                );

                if (input.value === "all" && input.checked) {
                    categoryInputs.forEach(item => {
                        item.checked = false;
                    });
                } else if (input.value !== "all") {
                    allInput.checked = false;

                    const allChecked = Array.from(categoryInputs).every(
                        item => item.checked
                    );

                    if (allChecked) {
                        allInput.checked = true;
                    }
                }

                updateMarkers();
                updateList();
            });
        });

        window.addEventListener("resize", function () {
            if (map) {
                map.resize();
            }
        });

        loadObjects();

        setInterval(loadObjects, REFRESH_INTERVAL);

        setInterval(function () {
            if (!following || !selectedId || !map) {
                return;
            }

            const object = objects.find(
                item => item.id === selectedId
            );

            if (object) {
                map.panTo([object.lon, object.lat]);
            }
        }, 2000);
    </script>
</body>
</html>
