
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Tracker</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #10151b;
            color: #e5eaf0;
            font-family: Arial, sans-serif;
        }

        header {
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            background: #171e26;
            border-bottom: 1px solid #303943;
        }

        .brand {
            font-size: 19px;
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        .status {
            font-size: 12px;
            color: #aab5c1;
        }

        .status span {
            color: #68cf91;
        }

        main {
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr) 280px;
            height: calc(100vh - 58px);
        }

        aside {
            min-height: 0;
            overflow-y: auto;
            background: #171e26;
            padding: 16px;
        }

        .left-panel {
            border-right: 1px solid #303943;
        }

        .right-panel {
            border-left: 1px solid #303943;
        }

        h2 {
            margin: 0 0 14px;
            font-size: 15px;
            font-weight: 600;
        }

        h3 {
            margin: 20px 0 10px;
            font-size: 12px;
            color: #aab5c1;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 10px;
            border: 1px solid #394550;
            border-radius: 4px;
            background: #111820;
            color: #e5eaf0;
            font-size: 13px;
        }

        input {
            margin-bottom: 9px;
        }

        button {
            cursor: pointer;
            background: #263747;
            border-color: #405568;
        }

        button:hover {
            background: #334a60;
        }

        .filter-list {
            display: grid;
            gap: 9px;
            font-size: 13px;
            color: #c5ced8;
        }

        .filter-list label {
            display: flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
        }

        .filter-list input {
            width: auto;
            margin: 0;
        }

        .object-list {
            margin-top: 12px;
            display: grid;
            gap: 5px;
        }

        .object-item {
            padding: 10px;
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .object-item:hover {
            background: #222d38;
        }

        .object-item.selected {
            background: #263747;
            border-color: #506b82;
        }

        .object-item small {
            display: block;
            margin-top: 5px;
            color: #8f9daa;
        }

        .map-area {
            position: relative;
            min-width: 0;
            min-height: 0;
            background: #dce3e8;
        }

        #map {
            width: 100%;
            height: 100%;
            min-height: 300px;
            background: #dce3e8;
        }

        .map-status {
            position: absolute;
            z-index: 500;
            bottom: 12px;
            left: 12px;
            padding: 8px 11px;
            background: rgba(20, 27, 35, 0.92);
            color: #dce5ed;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
        }

        .detail-empty {
            color: #8795a3;
            font-size: 13px;
            line-height: 1.5;
        }

        .detail-name {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .detail-id {
            color: #91a0ae;
            font-size: 12px;
            margin-bottom: 20px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 11px 0;
            border-bottom: 1px solid #303943;
            font-size: 13px;
        }

        .detail-row span:first-child {
            color: #91a0ae;
        }

        .detail-row span:last-child {
            text-align: right;
        }

        .detail-actions {
            display: grid;
            gap: 8px;
            margin-top: 18px;
        }

        .secondary {
            background: #171e26;
        }

        .count {
            color: #91a0ae;
            font-size: 12px;
            margin-top: 12px;
        }

        .loading {
            color: #91a0ae;
            font-size: 13px;
            padding: 12px 4px;
        }

        .leaflet-container {
            font-family: Arial, sans-serif;
        }

        @media (max-width: 950px) {
            main {
                grid-template-columns: 220px minmax(0, 1fr);
            }

            .right-panel {
                display: none;
            }
        }

        @media (max-width: 650px) {
            header {
                padding: 0 12px;
            }

            main {
                grid-template-columns: 1fr;
                grid-template-rows: 230px minmax(0, 1fr);
                height: calc(100vh - 58px);
            }

            .left-panel {
                border-right: none;
                border-bottom: 1px solid #303943;
            }

            .map-area {
                grid-row: 2;
            }

            aside {
                padding: 12px;
            }

            .object-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="brand">Space Tracker</div>
        <div class="status" id="connectionStatus">
            <span>●</span> Connecting
        </div>
    </header>

    <main>
        <aside class="left-panel">
            <h2>Objects</h2>

            <input
                type="text"
                id="search"
                placeholder="Search name or NORAD ID..."
            >

            <h3>Categories</h3>

            <div class="filter-list">
                <label>
                    <input type="checkbox" value="all" checked>
                    All objects
                </label>
                <label>
                    <input type="checkbox" value="stations" checked>
                    Space stations
                </label>
                <label>
                    <input type="checkbox" value="starlink" checked>
                    Starlink
                </label>
                <label>
                    <input type="checkbox" value="gps" checked>
                    GPS
                </label>
                <label>
                    <input type="checkbox" value="weather" checked>
                    Weather
                </label>
                <label>
                    <input type="checkbox" value="other" checked>
                    Other
                </label>
            </div>

            <h3>Tracked objects</h3>

            <div class="count" id="objectCount">
                Loading objects...
            </div>

            <div class="object-list" id="objectList">
                <div class="loading">Loading satellite data...</div>
            </div>
        </aside>

        <section class="map-area">
            <div id="map"></div>
            <div class="map-status" id="mapStatus">
                Loading map...
            </div>
        </section>

        <aside class="right-panel">
            <h2>Object information</h2>

            <div id="details">
                <div class="detail-empty">
                    Select an object on the map or from the list to see its information.
                </div>
            </div>
        </aside>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const API_URL =
            "https://satellites.orbitingfrog.com/api/positions?group=visual";

        const REFRESH_INTERVAL = 15000;

        const map = L.map("map", {
            worldCopyJump: true,
            zoomControl: true
        }).setView([20, 0], 2);

        const mapStatus = document.getElementById("mapStatus");

        const mapTiles = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution: "&copy; OpenStreetMap contributors",
                maxZoom: 19
            }
        );

        mapTiles.on("load", function () {
            mapStatus.textContent = "Map loaded";
        });

        mapTiles.on("tileerror", function () {
            mapStatus.textContent = "Some map tiles could not load";
        });

        mapTiles.addTo(map);

        let objects = [];
        let markers = new Map();
        let selectedObject = null;
        let trailLayer = null;
        let following = false;

        function getCategory(name) {
            const value = name.toLowerCase();

            if (
                value.includes("iss") ||
                value.includes("tiangong") ||
                value.includes("space station")
            ) {
                return "stations";
            }

            if (value.includes("starlink")) {
                return "starlink";
            }

            if (
                value.includes("gps") ||
                value.includes("navstar")
            ) {
                return "gps";
            }

            if (
                value.includes("weather") ||
                value.includes("noaa") ||
                value.includes("goes") ||
                value.includes("meteor")
            ) {
                return "weather";
            }

            return "other";
        }

        function normalizeObject(item) {
            return {
                id: String(item.noradId ?? item.id ?? ""),
                name: String(item.name || "Unknown object"),
                lat: Number(item.lat),
                lon: Number(item.lon),
                altitude: Number(item.alt),
                velocity: Number(item.velocity),
                color: item.color || "#4d9bd3",
                orbit: Array.isArray(item.orbit) ? item.orbit : [],
                category: getCategory(String(item.name || ""))
            };
        }

        function formatNumber(value, digits = 2) {
            if (!Number.isFinite(value)) {
                return "Unavailable";
            }

            return value.toLocaleString(undefined, {
                maximumFractionDigits: digits
            });
        }

        function makeMarker(object) {
            const marker = L.circleMarker(
                [object.lat, object.lon],
                {
                    radius: 5,
                    color: object.color,
                    fillColor: object.color,
                    fillOpacity: 0.9,
                    weight: 1
                }
            );

            marker.bindTooltip(object.name);

            marker.on("click", function () {
                selectObject(object.id);
            });

            return marker;
        }

        function updateMarkers() {
            const visibleObjects = getVisibleObjects();
            const visibleIds = new Set(
                visibleObjects.map(object => object.id)
            );

            for (const [id, marker] of markers) {
                if (!visibleIds.has(id)) {
                    map.removeLayer(marker);
                    markers.delete(id);
                }
            }

            for (const object of visibleObjects) {
                if (!Number.isFinite(object.lat) ||
                    !Number.isFinite(object.lon)) {
                    continue;
                }

                let marker = markers.get(object.id);

                if (!marker) {
                    marker = makeMarker(object);
                    markers.set(object.id, marker);
                    marker.addTo(map);
                } else {
                    marker.setLatLng([object.lat, object.lon]);
                    marker.setStyle({
                        color: object.color,
                        fillColor: object.color
                    });
                }
            }

            if (selectedObject) {
                const updated = objects.find(
                    object => object.id === selectedObject.id
                );

                if (updated) {
                    selectedObject = updated;
                    showDetails(updated);
                }
            }
        }

        function getVisibleObjects() {
            const search = document
                .getElementById("search")
                .value
                .trim()
                .toLowerCase();

            const checked = Array.from(
                document.querySelectorAll(".filter-list input:checked")
            ).map(input => input.value);

            const showAll = checked.includes("all");

            return objects.filter(object => {
                const matchesSearch =
                    object.name.toLowerCase().includes(search) ||
                    object.id.toLowerCase().includes(search);

                const matchesCategory =
                    showAll || checked.includes(object.category);

                return matchesSearch && matchesCategory;
            });
        }

        function updateList() {
            const list = document.getElementById("objectList");
            const count = document.getElementById("objectCount");

            const visibleObjects = getVisibleObjects();

            count.textContent =
                visibleObjects.length.toLocaleString() + " objects shown";

            list.innerHTML = "";

            if (visibleObjects.length === 0) {
                list.innerHTML =
                    '<div class="loading">No matching objects.</div>';
                return;
            }

            const fragment = document.createDocumentFragment();

            visibleObjects.slice(0, 300).forEach(object => {
                const item = document.createElement("div");

                item.className = "object-item";

                if (
                    selectedObject &&
                    selectedObject.id === object.id
                ) {
                    item.classList.add("selected");
                }

                const name = document.createElement("div");
                name.textContent = object.name;

                const id = document.createElement("small");
                id.textContent = "NORAD " + object.id;

                item.appendChild(name);
                item.appendChild(id);

                item.addEventListener("click", function () {
                    selectObject(object.id);
                });

                fragment.appendChild(item);
            });

            list.appendChild(fragment);
        }

        function showDetails(object) {
            const details = document.getElementById("details");

            details.innerHTML = "";

            const name = document.createElement("div");
            name.className = "detail-name";
            name.textContent = object.name;

            const id = document.createElement("div");
            id.className = "detail-id";
            id.textContent = "NORAD ID: " + object.id;

            details.appendChild(name);
            details.appendChild(id);

            const rows = [
                ["Category", object.category],
                ["Latitude", formatNumber(object.lat, 5) + "°"],
                ["Longitude", formatNumber(object.lon, 5) + "°"],
                ["Altitude", formatNumber(object.altitude) + " km"],
                ["Velocity", formatNumber(object.velocity, 3) + " km/s"]
            ];

            rows.forEach(([label, value]) => {
                const row = document.createElement("div");
                row.className = "detail-row";

                const left = document.createElement("span");
                left.textContent = label;

                const right = document.createElement("span");
                right.textContent = value;

                row.appendChild(left);
                row.appendChild(right);
                details.appendChild(row);
            });

            const actions = document.createElement("div");
            actions.className = "detail-actions";

            const followButton = document.createElement("button");
            followButton.textContent = following
                ? "Stop following"
                : "Follow object";

            followButton.addEventListener("click", function () {
                following = !following;

                if (following) {
                    map.setView(
                        [object.lat, object.lon],
                        Math.max(map.getZoom(), 4)
                    );
                }

                showDetails(object);
            });

            const trailButton = document.createElement("button");
            trailButton.className = "secondary";
            trailButton.textContent = "Show orbital trail";

            trailButton.addEventListener("click", function () {
                showTrail(object);
            });

            const clearButton = document.createElement("button");
            clearButton.className = "secondary";
            clearButton.textContent = "Clear trail";

            clearButton.addEventListener("click", clearTrail);

            actions.appendChild(followButton);
            actions.appendChild(trailButton);
            actions.appendChild(clearButton);

            details.appendChild(actions);
        }

        function selectObject(id) {
            const object = objects.find(item => item.id === id);

            if (!object) {
                return;
            }

            selectedObject = object;
            following = false;

            updateList();
            showDetails(object);

            map.setView(
                [object.lat, object.lon],
                Math.max(map.getZoom(), 4)
            );
        }

        function showTrail(object) {
            clearTrail();

            if (!object.orbit || object.orbit.length < 2) {
                mapStatus.textContent =
                    "No orbital trail data available for this object";
                return;
            }

            const points = object.orbit
                .filter(point =>
                    Array.isArray(point) &&
                    Number.isFinite(Number(point[0])) &&
                    Number.isFinite(Number(point[1]))
                )
                .map(point => [
                    Number(point[0]),
                    Number(point[1])
                ]);

            if (points.length < 2) {
                mapStatus.textContent =
                    "Not enough trail points available";
                return;
            }

            trailLayer = L.polyline(points, {
                color: object.color,
                weight: 2,
                opacity: 0.8
            }).addTo(map);

            map.fitBounds(trailLayer.getBounds(), {
                padding: [35, 35]
            });

            mapStatus.textContent = "Showing orbital trail";
        }

        function clearTrail() {
            if (trailLayer) {
                map.removeLayer(trailLayer);
                trailLayer = null;
            }

            mapStatus.textContent = "Map loaded";
        }

        async function loadObjects() {
            const status = document.getElementById("connectionStatus");

            try {
                const response = await fetch(API_URL, {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error("Server returned " + response.status);
                }

                const data = await response.json();

                if (!Array.isArray(data)) {
                    throw new Error("Unexpected satellite data format");
                }

                objects = data
                    .map(normalizeObject)
                    .filter(object =>
                        object.id &&
                        Number.isFinite(object.lat) &&
                        Number.isFinite(object.lon)
                    );

                updateMarkers();
                updateList();

                status.innerHTML =
                    '<span>●</span> Connected · ' +
                    objects.length.toLocaleString() +
                    " objects";

            } catch (error) {
                console.error("Satellite data error:", error);

                status.innerHTML =
                    '<span style="color:#e58b80">●</span> Data unavailable';

                document.getElementById("objectList").innerHTML =
                    '<div class="loading">Could not load satellite data. Check the browser console for details.</div>';
            }
        }

        document.getElementById("search").addEventListener(
            "input",
            function () {
                updateList();
                updateMarkers();
            }
        );

        document.querySelectorAll(".filter-list input").forEach(input => {
            input.addEventListener("change", function () {
                if (input.value === "all" && input.checked) {
                    document.querySelectorAll(
                        '.filter-list input:not([value="all"])'
                    ).forEach(other => {
                        other.checked = false;
                    });
                } else if (input.value !== "all" && input.checked) {
                    document.querySelector(
                        '.filter-list input[value="all"]'
                    ).checked = false;
                }

                const allFilters = document.querySelectorAll(
                    '.filter-list input:not([value="all"])'
                );

                const allChecked = Array.from(allFilters).every(
                    filter => filter.checked
                );

                if (allChecked) {
                    document.querySelector(
                        '.filter-list input[value="all"]'
                    ).checked = true;
                }

                updateList();
                updateMarkers();
            });
        });

        map.whenReady(function () {
            map.invalidateSize();
            mapStatus.textContent = "Map ready";
        });

        window.addEventListener("resize", function () {
            map.invalidateSize();
        });

        loadObjects();

        setInterval(loadObjects, REFRESH_INTERVAL);

        setInterval(function () {
            if (following && selectedObject) {
                const updated = objects.find(
                    object => object.id === selectedObject.id
                );

                if (updated) {
                    selectedObject = updated;

                    map.panTo(
                        [updated.lat, updated.lon],
                        { animate: true }
                    );
                }
            }
        }, 2000);
    </script>
</body>
</html>
