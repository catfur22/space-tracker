
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#101419;color:#e6e9ed;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
button,input{font:inherit}
.topbar{height:58px;background:#171d24;border-bottom:1px solid #303943;display:flex;align-items:center;padding:0 20px;gap:22px}
.brand{font-size:17px;font-weight:700;letter-spacing:2px}
.brand span{color:#8cb9d8}
.status{font-size:12px;color:#9ba8b4;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#727e89}
.dot.live{background:#57c98a}
.topright{margin-left:auto;font-size:12px;color:#9ba8b4}
.layout{height:calc(100vh - 58px);display:grid;grid-template-columns:285px minmax(0,1fr) 280px}
.panel{background:#171d24;min-height:0;overflow:hidden}
.left{border-right:1px solid #303943;display:flex;flex-direction:column}
.right{border-left:1px solid #303943;padding:18px;overflow-y:auto}
.panelhead{padding:17px 16px 12px;border-bottom:1px solid #303943}
.paneltitle{font-size:11px;font-weight:bold;letter-spacing:1.4px;color:#8d9aa7}
.search{width:100%;margin-top:13px;background:#10161c;border:1px solid #39444f;border-radius:4px;padding:10px;color:#e6e9ed;outline:none}
.search:focus{border-color:#83b8d9}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.filter{background:#222b34;border:1px solid #39444f;color:#aebac5;border-radius:3px;padding:6px 8px;font-size:11px;cursor:pointer}
.filter.active{background:#30485b;border-color:#668ba6;color:#fff}
.object-count{padding:12px 16px;color:#8d9aa7;font-size:11px;border-bottom:1px solid #303943}
.object-list{overflow-y:auto;flex:1}
.object{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:12px 14px;background:none;border:0;border-bottom:1px solid #252e37;color:#e6e9ed;cursor:pointer}
.object:hover{background:#202a34}
.object.selected{background:#263746}
.object-color{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.object-info{min-width:0;flex:1}
.object-name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.object-id{font-size:10px;color:#84919d;margin-top:4px}
.object-alt{font-size:10px;color:#9ba8b4;white-space:nowrap}
.mapwrap{position:relative;min-width:0;min-height:0;background:#0d141a}
#map{height:100%;width:100%;background:#101820}
.map-controls{position:absolute;z-index:500;top:14px;left:14px;display:flex;gap:7px}
.control{background:#18232d;border:1px solid #43515d;color:#dce4eb;padding:9px 12px;border-radius:3px;font-size:11px;cursor:pointer}
.control:hover{background:#293b4a}
.map-note{position:absolute;bottom:12px;left:12px;z-index:500;background:#17212bdc;padding:7px 10px;color:#9eabb7;font-size:10px;border:1px solid #34414c}
.detail-title{font-size:11px;letter-spacing:1.4px;color:#8d9aa7;font-weight:bold;margin-bottom:20px}
.empty{color:#7f8c98;font-size:12px;line-height:1.6}
.selected-name{font-size:19px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.selected-id{font-size:11px;color:#8d9aa7;margin-top:7px}
.detail-rule{height:1px;background:#303943;margin:18px 0}
.detail-row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #29323b;font-size:12px}
.detail-row span:first-child{color:#8996a2}
.detail-row span:last-child{text-align:right;color:#e4e9ee;font-variant-numeric:tabular-nums}
.detail-actions{display:flex;gap:7px;margin-top:18px}
.detail-actions button{flex:1}
.small-note{font-size:10px;color:#788691;line-height:1.6;margin-top:18px}
.error{color:#e7a18e}
.leaflet-container{font-family:Arial,Helvetica,sans-serif}
.leaflet-control-attribution{font-size:9px!important}
@media(max-width:900px){
.layout{grid-template-columns:230px minmax(0,1fr)}
.right{display:none}
}
@media(max-width:600px){
body{overflow:auto}
.topbar{height:52px;padding:0 12px}
.topright{display:none}
.layout{height:calc(100vh - 52px);grid-template-columns:1fr;grid-template-rows:42% 58%}
.left{grid-row:2;border-right:0;border-top:1px solid #303943}
.mapwrap{grid-row:1}
.map-controls{top:8px;left:8px}
.control{padding:7px 9px}
.panelhead{padding:10px 12px}
.object-count{padding:8px 12px}
.object{padding:9px 12px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">SPACE <span>TRACKER</span></div>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">CONNECTING</span></div>
  <div class="topright" id="updated">Waiting for data</div>
</header>

<main class="layout">
  <aside class="panel left">
    <div class="panelhead">
      <div class="paneltitle">TRACKED OBJECTS</div>
      <input class="search" id="search" placeholder="Search name or NORAD ID..." autocomplete="off">
      <div class="filters" id="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="station">Stations</button>
        <button class="filter" data-filter="starlink">Starlink</button>
        <button class="filter" data-filter="gps">GPS</button>
        <button class="filter" data-filter="weather">Weather</button>
        <button class="filter" data-filter="other">Other</button>
      </div>
    </div>
    <div class="object-count" id="objectCount">Loading objects...</div>
    <div class="object-list" id="objectList"></div>
  </aside>

  <section class="mapwrap">
    <div id="map"></div>
    <div class="map-controls">
      <button class="control" id="worldBtn">World view</button>
      <button class="control" id="followBtn">Follow: OFF</button>
      <button class="control" id="refreshBtn">Refresh</button>
    </div>
    <div class="map-note">Positions supplied by Orbiting Frog</div>
  </section>

  <aside class="panel right">
    <div class="detail-title">OBJECT INFORMATION</div>
    <div id="details" class="empty">Select an object on the map or in the list to inspect it.</div>
  </aside>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CARTO_KEY = "cb1_5e6t_1_97d50199389ca4dc8f19c1b6";
const API = "https://satellites.orbitingfrog.com/api/positions?group=visual";
const REFRESH_MS = 30000;

const map = L.map("map", {
  worldCopyJump: true,
  minZoom: 2,
  maxZoom: 9
}).setView([20, 0], 2);

L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=" + encodeURIComponent(CARTO_KEY),
  {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: "abcd",
    maxZoom: 19
  }
).addTo(map);

const markerLayer = L.layerGroup().addTo(map);
const trailLayer = L.layerGroup().addTo(map);

let objects = [];
let selectedId = null;
let activeFilter = "all";
let searchText = "";
let follow = false;
let loading = false;

const $ = id => document.getElementById(id);

function setStatus(text, live, error = false) {
  $("statusText").textContent = text;
  $("statusDot").className = "dot" + (live ? " live" : "");
  $("statusText").className = error ? "error" : "";
}

function classify(item) {
  const n = item.name.toLowerCase();
  if (/starlink/.test(n)) return "starlink";
  if (/gps|navstar/.test(n)) return "gps";
  if (/iss|tiangong|soyuz|space station|crew dragon/.test(n)) return "station";
  if (/noaa|goes|meteosat|weather|fengyun|himawari/.test(n)) return "weather";
  return "other";
}

function normalize(item) {
  if (!item || item.lat === undefined || item.lon === undefined) return null;

  const lat = Number(item.lat);
  const lon = Number(item.lon);

  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
  if (lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;

  return {
    id: String(item.noradId ?? item.id ?? ""),
    name: String(item.name || "Unknown object"),
    lat,
    lon,
    altitude: Number(item.alt),
    velocity: Number(item.velocity),
    color: /^#[0-9a-f]{6}$/i.test(item.color || "") ? item.color : "#8cb9d8",
    orbit: Array.isArray(item.orbit) ? item.orbit : [],
    category: classify(item)
  };
}

function formatNumber(value, digits = 1) {
  return Number.isFinite(value) ? value.toLocaleString("en-US", {
    maximumFractionDigits: digits
  }) : "Not provided";
}

function altitudeText(value) {
  return Number.isFinite(value) ? formatNumber(value) + " km" : "Not provided";
}

function speedText(value) {
  return Number.isFinite(value) ? formatNumber(value, 3) + " km/s" : "Not provided";
}

function visibleObjects() {
  return objects.filter(item => {
    const matchesFilter = activeFilter === "all" || item.category === activeFilter;
    const matchesSearch = !searchText ||
      item.name.toLowerCase().includes(searchText) ||
      item.id.toLowerCase().includes(searchText);
    return matchesFilter && matchesSearch;
  });
}

function makeMarker(item) {
  const isSelected = item.id === selectedId;
  return L.circleMarker([item.lat, item.lon], {
    radius: isSelected ? 7 : 4,
    color: isSelected ? "#ffffff" : item.color,
    weight: isSelected ? 2 : 1,
    fillColor: item.color,
    fillOpacity: 0.95
  }).on("click", () => selectObject(item.id));
}

function renderMap() {
  markerLayer.clearLayers();
  for (const item of visibleObjects()) {
    makeMarker(item).addTo(markerLayer);
  }
}

function renderList() {
  const shown = visibleObjects();
  $("objectCount").textContent =
    shown.length.toLocaleString() + " objects shown · " +
    objects.length.toLocaleString() + " received";

  const list = $("objectList");
  list.replaceChildren();

  if (!shown.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.style.padding = "18px";
    empty.textContent = objects.length ? "No objects match your search." : "No object data available.";
    list.appendChild(empty);
    return;
  }

  const fragment = document.createDocumentFragment();

  for (const item of shown) {
    const button = document.createElement("button");
    button.className = "object" + (item.id === selectedId ? " selected" : "");
    button.type = "button";

    const color = document.createElement("span");
    color.className = "object-color";
    color.style.background = item.color;

    const info = document.createElement("span");
    info.className = "object-info";

    const name = document.createElement("div");
    name.className = "object-name";
    name.textContent = item.name;

    const id = document.createElement("div");
    id.className = "object-id";
    id.textContent = "NORAD " + (item.id || "Unknown");

    info.append(name, id);

    const alt = document.createElement("span");
    alt.className = "object-alt";
    alt.textContent = Number.isFinite(item.altitude) ? Math.round(item.altitude) + " km" : "";

    button.append(color, info, alt);
    button.addEventListener("click", () => selectObject(item.id));
    fragment.appendChild(button);
  }

  list.appendChild(fragment);
}

function drawTrail(item) {
  trailLayer.clearLayers();
  if (!item || !item.orbit.length) return;

  let segment = [];
  const segments = [];

  for (const point of item.orbit) {
    if (!Array.isArray(point) || point.length < 2) continue;

    const lat = Number(point[0]);
    const lon = Number(point[1]);

    if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
    if (lat < -90 || lat > 90 || lon < -180 || lon > 180) continue;

    if (segment.length && Math.abs(lon - segment[segment.length - 1][1]) > 180) {
      if (segment.length > 1) segments.push(segment);
      segment = [];
    }
    segment.push([lat, lon]);
  }

  if (segment.length > 1) segments.push(segment);

  for (const points of segments) {
    L.polyline(points, {
      color: item.color,
      weight: 2,
      opacity: 0.8,
      dashArray: "5 6"
    }).addTo(trailLayer);
  }
}

function renderDetails(item) {
  const panel = $("details");

  if (!item) {
    panel.className = "empty";
    panel.textContent = "Select an object on the map or in the list to inspect it.";
    return;
  }

  panel.className = "";

  const title = document.createElement("div");
  title.className = "selected-name";
  title.textContent = item.name;

  const id = document.createElement("div");
  id.className = "selected-id";
  id.textContent = "NORAD ID: " + (item.id || "Not provided");

  panel.replaceChildren(title, id);

  const rule = document.createElement("div");
  rule.className = "detail-rule";
  panel.appendChild(rule);

  const rows = [
    ["Category", item.category.charAt(0).toUpperCase() + item.category.slice(1)],
    ["Altitude", altitudeText(item.altitude)],
    ["Velocity", speedText(item.velocity)],
    ["Latitude", formatNumber(item.lat, 5) + "°"],
    ["Longitude", formatNumber(item.lon, 5) + "°"],
    ["Orbit points", String(item.orbit.length)]
  ];

  for (const [label, value] of rows) {
    const row = document.createElement("div");
    row.className = "detail-row";
    const left = document.createElement("span");
    left.textContent = label;
    const right = document.createElement("span");
    right.textContent = value;
    row.append(left, right);
    panel.appendChild(row);
  }

  const actions = document.createElement("div");
  actions.className = "detail-actions";

  const center = document.createElement("button");
  center.className = "control";
  center.textContent = "Center map";
  center.addEventListener("click", () => {
    map.setView([item.lat, item.lon], Math.max(map.getZoom(), 4));
  });

  const trail = document.createElement("button");
  trail.className = "control";
  trail.textContent = "Show trail";
  trail.addEventListener("click", () => drawTrail(item));

  actions.append(center, trail);
  panel.appendChild(actions);

  const note = document.createElement("div");
  note.className = "small-note";
  note.textContent = "Telemetry and orbit points are supplied by the data provider. Orbital inclination is not included in this feed.";
  panel.appendChild(note);
}

function selectObject(id) {
  const item = objects.find(object => object.id === id);
  if (!item) return;

  selectedId = id;
  renderMap();
  renderList();
  renderDetails(item);
  drawTrail(item);

  if (follow) map.panTo([item.lat, item.lon]);
}

async function loadData() {
  if (loading) return;
  loading = true;
  $("refreshBtn").textContent = "Loading...";
  setStatus("CONNECTING", false);

  try {
    const response = await fetch(API, {
      method: "GET",
      headers: { "Accept": "application/json" },
      cache: "no-store"
    });

    if (!response.ok) throw new Error("API returned HTTP " + response.status);

    const data = await response.json();
    if (!Array.isArray(data)) throw new Error("Unexpected API response: expected a JSON array");

    const normalized = data.map(normalize).filter(Boolean);
    if (!normalized.length) throw new Error("The API returned no usable position records");

    objects = normalized;
    setStatus("LIVE", true);
    $("updated").textContent = "Updated " + new Date().toLocaleTimeString();

    if (selectedId && objects.some(item => item.id === selectedId)) {
      const selected = objects.find(item => item.id === selectedId);
      renderDetails(selected);
      drawTrail(selected);
      if (follow) map.panTo([selected.lat, selected.lon]);
    } else if (selectedId) {
      selectedId = null;
      trailLayer.clearLayers();
      renderDetails(null);
    }

    renderMap();
    renderList();

  } catch (error) {
    console.error("Space Tracker data error:", error);
    setStatus("DATA ERROR", false, true);
    $("updated").textContent = error.message.includes("Failed to fetch")
      ? "Browser blocked the request"
      : error.message;

    if (!objects.length) {
      $("objectCount").textContent = "Unable to load live data";
      $("objectList").innerHTML =
        '<div class="empty" style="padding:16px">Could not connect to the satellite feed.<br><br>' +
        'If the browser reports a CORS or network error, the API is blocking this website from reading its data. Opening the API URL directly does not prove JavaScript requests are allowed.</div>';
    }
  } finally {
    loading = false;
    $("refreshBtn").textContent = "Refresh";
  }
}

$("search").addEventListener("input", event => {
  searchText = event.target.value.trim().toLowerCase();
  renderList();
  renderMap();
});

$("filters").addEventListener("click", event => {
  const button = event.target.closest("[data-filter]");
  if (!button) return;

  activeFilter = button.dataset.filter;
  document.querySelectorAll(".filter").forEach(element => {
    element.classList.toggle("active", element === button);
  });

  renderList();
  renderMap();
});

$("worldBtn").addEventListener("click", () => map.setView([20, 0], 2));

$("followBtn").addEventListener("click", () => {
  follow = !follow;
  $("followBtn").textContent = "Follow: " + (follow ? "ON" : "OFF");

  if (follow && selectedId) {
    const item = objects.find(object => object.id === selectedId);
    if (item) map.panTo([item.lat, item.lon]);
  }
});

$("refreshBtn").addEventListener("click", loadData);

loadData();
setInterval(loadData, REFRESH_MS);
</script>
</body>
</html>
